[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazpii-bench"
version = "0.1.0"
description = "Open benchmark for PII detection in Kazakh and Russian texts: generation, ingestion, harness"
license = { text = "CC-BY-4.0" }
requires-python = ">=3.9"
dependencies = ["kz-identifiers>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
layerb = []

[project.scripts]
kazpii-bench = "kazpii_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]
